# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.
name: Publish Docker image
on:
  release:
    types:
      - published
env:
  REPO: waddleperf
jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: |
            penguincloud/${{ env.REPO }}-server
            ghcr.io/${{ github.repository }}-server

      - name: Set platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=$(echo "$PLATFORM" | tr '/' '-')" >> $GITHUB_ENV

      - name: Prepare platform-specific tags
        id: platform-tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PLATFORM_SLUG: ${{ env.PLATFORM_SLUG }}
          REPO: ${{ env.REPO }}
        run: |
          {
            echo 'tags<<EOF'
            while IFS= read -r tag; do
              echo "${tag}-${PLATFORM_SLUG}"
            done <<< "$TAGS"
            echo "ghcr.io/penguincloud/${REPO}-server:latest-${PLATFORM_SLUG}"
            echo "penguincloud/${REPO}-server:latest-${PLATFORM_SLUG}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: ./server
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.platform-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  merge:
    name: Merge multi-arch manifests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: |
            penguincloud/${{ env.REPO }}-server
            ghcr.io/${{ github.repository }}-server

      - name: Create multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REPO: ${{ env.REPO }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create \
              -t "$tag" \
              "${tag}-linux-amd64" \
              "${tag}-linux-arm64"
          done <<< "$TAGS"
          docker buildx imagetools create \
            -t "ghcr.io/penguincloud/${REPO}-server:latest" \
            "ghcr.io/penguincloud/${REPO}-server:latest-linux-amd64" \
            "ghcr.io/penguincloud/${REPO}-server:latest-linux-arm64"
          docker buildx imagetools create \
            -t "penguincloud/${REPO}-server:latest" \
            "penguincloud/${REPO}-server:latest-linux-amd64" \
            "penguincloud/${REPO}-server:latest-linux-arm64"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
