name: Build Go Client with Docker

on:
  push:
    branches: [main, 4.x, "v*"]
    tags: ['v*']
    paths:
      - 'goClient/**'
      - '.github/workflows/build-go-client.yml'
  pull_request:
    branches: [main, 4.x, "v*"]
    paths:
      - 'goClient/**'
      - '.github/workflows/build-go-client.yml'
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_GO: ${{ github.repository_owner }}/waddleperf-go-client
  IMAGE_NAME_LEGACY: penguincloud/waddleperf-client

jobs:
  metadata:
    name: Determine Build Metadata
    runs-on: ubuntu-latest
    outputs:
      postfix: ${{ steps.vars.outputs.postfix }}
      tag: ${{ steps.vars.outputs.tag }}
      is_main: ${{ steps.vars.outputs.is_main }}
      is_release: ${{ steps.vars.outputs.is_release }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set variables
        id: vars
        run: |
          VERSION=$(cat .version | cut -d'.' -f1-3 | tr -d '[:space:]' || echo "0.0.0")
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "postfix=-gamma" >> $GITHUB_OUTPUT
            echo "tag=gamma" >> $GITHUB_OUTPUT
            echo "is_main=true" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/v* || "${{ github.ref }}" == refs/heads/4.x ]]; then
            echo "postfix=-beta" >> $GITHUB_OUTPUT
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "postfix=-alpha" >> $GITHUB_OUTPUT
            echo "tag=alpha" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-binaries:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: write
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64,windows/arm64

    - name: Extract build metadata
      id: meta
      run: |
        VERSION="${{ needs.metadata.outputs.version }}${{ needs.metadata.outputs.postfix }}"
        BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        GIT_COMMIT="${GITHUB_SHA::8}"
        PLATFORM="${{ matrix.platform }}"
        OS="${PLATFORM%/*}"
        ARCH="${PLATFORM#*/}"
        
        EXT=""
        if [[ "$OS" == "windows" ]]; then
          EXT=".exe"
        fi
        
        OUTPUT_NAME="waddleperf-${OS}-${ARCH}${EXT}"
        
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "BUILD_TIME=${BUILD_TIME}" >> $GITHUB_OUTPUT
        echo "GIT_COMMIT=${GIT_COMMIT}" >> $GITHUB_OUTPUT
        echo "PLATFORM=${PLATFORM}" >> $GITHUB_OUTPUT
        echo "OS=${OS}" >> $GITHUB_OUTPUT
        echo "ARCH=${ARCH}" >> $GITHUB_OUTPUT
        echo "OUTPUT_NAME=${OUTPUT_NAME}" >> $GITHUB_OUTPUT

    - name: Build binary with Docker
      working-directory: ./goClient
      run: |
        docker buildx build \
          --file Dockerfile \
          --target builder \
          --platform ${{ matrix.platform }} \
          --build-arg "TARGETOS=${{ steps.meta.outputs.OS }}" \
          --build-arg "TARGETARCH=${{ steps.meta.outputs.ARCH }}" \
          --build-arg "VERSION=${{ steps.meta.outputs.VERSION }}" \
          --build-arg "BUILD_TIME=${{ steps.meta.outputs.BUILD_TIME }}" \
          --build-arg "GIT_COMMIT=${{ steps.meta.outputs.GIT_COMMIT }}" \
          --output type=local,dest=./dist \
          .

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.meta.outputs.OUTPUT_NAME }}
        path: goClient/dist/${{ steps.meta.outputs.OUTPUT_NAME }}
        retention-days: 7

  build-macos-universal:
    name: Build macOS Universal Binary
    runs-on: macos-latest
    needs: [metadata, build-binaries]
    if: always() && (needs.build-binaries.result == 'success')
    permissions:
      contents: write
    
    steps:
    - name: Download macOS AMD64 binary
      uses: actions/download-artifact@v4
      with:
        name: waddleperf-darwin-amd64
        path: ./binaries

    - name: Download macOS ARM64 binary
      uses: actions/download-artifact@v4
      with:
        name: waddleperf-darwin-arm64
        path: ./binaries

    - name: Create universal binary
      run: |
        chmod +x binaries/waddleperf-darwin-*
        lipo -create -output waddleperf-darwin-universal binaries/waddleperf-darwin-amd64 binaries/waddleperf-darwin-arm64

    - name: Upload universal binary
      uses: actions/upload-artifact@v4
      with:
        name: waddleperf-darwin-universal
        path: waddleperf-darwin-universal
        retention-days: 7

  build-docker-images:
    name: Build Multi-Platform Docker Images
    runs-on: ubuntu-latest
    needs: [metadata, build-binaries]
    if: always() && (needs.build-binaries.result == 'success')
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Linux AMD64 binary
      uses: actions/download-artifact@v4
      with:
        name: waddleperf-linux-amd64
        path: ./binaries/amd64

    - name: Download Linux ARM64 binary
      uses: actions/download-artifact@v4
      with:
        name: waddleperf-linux-arm64
        path: ./binaries/arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64,linux/arm64

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_GHCR }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GO }}
          ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_LEGACY }}
        tags: |
          type=raw,value=${{ needs.metadata.outputs.tag }}
          type=raw,value=${{ needs.metadata.outputs.version }}${{ needs.metadata.outputs.postfix }}
          type=sha,prefix=${{ needs.metadata.outputs.tag }}-

    - name: Prepare Docker context
      working-directory: ./goClient
      run: |
        mkdir -p binaries
        cp ../binaries/amd64/waddleperf-linux-amd64 binaries/
        cp ../binaries/arm64/waddleperf-linux-arm64 binaries/
        cat > Dockerfile.runtime << 'EOF'
        FROM alpine:3.19
        RUN apk add --no-cache ca-certificates tzdata curl iputils-ping bind-tools net-tools iperf3 mtr && adduser -D -u 1000 waddleperf
        COPY binaries/ /tmp/binaries/
        ARG TARGETARCH
        RUN BINARY_NAME="waddleperf-linux-${TARGETARCH}" && cp "/tmp/binaries/${BINARY_NAME}" /usr/local/bin/waddleperf && chmod +x /usr/local/bin/waddleperf && rm -rf /tmp/binaries
        USER waddleperf
        WORKDIR /home/waddleperf
        ENTRYPOINT ["/usr/local/bin/waddleperf"]
        CMD ["--help"]
        EOF

    - name: Build and push Docker images
      uses: docker/build-push-action@v5
      with:
        context: ./goClient
        file: ./goClient/Dockerfile.runtime
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  create-release-packages:
    name: Create Release Packages
    runs-on: ubuntu-latest
    needs: [metadata, build-binaries, build-macos-universal]
    if: always() && (needs.build-binaries.result == 'success')
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all binary artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Create distribution packages
      run: |
        mkdir -p packages
        for artifact_dir in ./artifacts/waddleperf-*; do
          if [[ -d "$artifact_dir" ]]; then
            binary_path=$(find "$artifact_dir" -name "waddleperf-*" -type f | head -1)
            if [[ -n "$binary_path" ]]; then
              binary_name=$(basename "$binary_path")
              cp "$binary_path" "packages/"
              cd packages
              if [[ "$binary_name" == *windows* ]]; then
                zip "${binary_name%.exe}${{ needs.metadata.outputs.postfix }}.zip" "$binary_name"
              else
                tar czf "${binary_name}${{ needs.metadata.outputs.postfix }}.tar.gz" "$binary_name"
              fi
              rm "$binary_name"
              cd ..
            fi
          fi
        done
        cd packages && sha256sum * > SHA256SUMS.txt

    - name: Upload distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: distribution-packages${{ needs.metadata.outputs.postfix }}
        path: packages/
        retention-days: 30

  pre-release:
    name: Update Pre-Release
    runs-on: ubuntu-latest
    needs: [metadata, create-release-packages]
    if: needs.metadata.outputs.is_main == 'true'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: distribution-packages${{ needs.metadata.outputs.postfix }}
          path: ./packages
      - name: Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          TAG="v$VERSION-gamma"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Pre-release $TAG" --prerelease --notes "Automated pre-release for main branch"
          fi
          gh release upload "$TAG" ./packages/* --clobber

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-binaries, build-macos-universal, build-docker-images, create-release-packages]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## WaddlePerf Go Client Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Binaries | ${{ needs.build-binaries.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS Universal | ${{ needs.build-macos-universal.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Images | ${{ needs.build-docker-images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Packages | ${{ needs.create-release-packages.result }} |" >> $GITHUB_STEP_SUMMARY
