name: Build webClient Frontend

on:
  push:
    branches: [main, 4.x, "v*"]
    tags: ['v*']
    paths:
      - 'webClient/frontend/**'
      - 'webClient/Dockerfile.frontend'
      - '.github/workflows/webclient-frontend.yml'
  pull_request:
    branches: [main, 4.x, "v*"]
    paths:
      - 'webClient/frontend/**'
      - 'webClient/Dockerfile.frontend'
      - '.github/workflows/webclient-frontend.yml'
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_NAME: webclient-frontend

jobs:
  metadata:
    name: Determine Build Metadata
    runs-on: ubuntu-latest
    outputs:
      postfix: ${{ steps.vars.outputs.postfix }}
      tag: ${{ steps.vars.outputs.tag }}
      is_main: ${{ steps.vars.outputs.is_main }}
      is_release: ${{ steps.vars.outputs.is_release }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set variables
        id: vars
        run: |
          VERSION=$(cat .version | cut -d'.' -f1-3 | tr -d '[:space:]' || echo "0.0.0")
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "postfix=-gamma" >> $GITHUB_OUTPUT
            echo "tag=gamma" >> $GITHUB_OUTPUT
            echo "is_main=true" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/v* || "${{ github.ref }}" == refs/heads/4.x ]]; then
            echo "postfix=-beta" >> $GITHUB_OUTPUT
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "postfix=-alpha" >> $GITHUB_OUTPUT
            echo "tag=alpha" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  test:
    name: Test React Frontend
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webClient/frontend/package-lock.json

      - name: Install dependencies
        working-directory: webClient/frontend
        run: npm ci

      - name: Lint
        working-directory: webClient/frontend
        run: npm run lint || true

      - name: Type check
        working-directory: webClient/frontend
        run: npm run type-check

      - name: Run Vitest tests with coverage
        run: npm run test:coverage
        working-directory: webClient/frontend

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: webClient/frontend/coverage/lcov.info
          flags: webclient-frontend

      - name: Build
        working-directory: webClient/frontend
        run: npm run build

  build:
    name: Build and push
    runs-on: ubuntu-latest
    needs: [metadata, test]
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKER }}/penguincloud/waddleperf-${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.tag }}
            type=raw,value=${{ needs.metadata.outputs.version }}${{ needs.metadata.outputs.postfix }}
            type=sha,prefix=${{ needs.metadata.outputs.tag }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./webClient
          file: ./webClient/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export package.json for artifact
        run: |
          cp webClient/frontend/package.json webclient-frontend-package${{ needs.metadata.outputs.postfix }}.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webclient-frontend-package${{ needs.metadata.outputs.postfix }}
          path: webclient-frontend-package${{ needs.metadata.outputs.postfix }}.json

  pre-release:
    name: Update Pre-Release
    runs-on: ubuntu-latest
    needs: [metadata, build]
    if: needs.metadata.outputs.is_main == 'true'
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webclient-frontend-package${{ needs.metadata.outputs.postfix }}
          path: .
      - name: Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          TAG="v$VERSION-gamma"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Pre-release $TAG" --prerelease --notes "Automated pre-release for main branch"
          fi
          gh release upload "$TAG" webclient-frontend-package${{ needs.metadata.outputs.postfix }}.json --clobber

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          echo "✅ All checks passed"
