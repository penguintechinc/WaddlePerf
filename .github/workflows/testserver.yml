name: Build testServer

on:
  push:
    branches: [main, 4.x, v*]
    paths:
      - 'testServer/**'
      - '.github/workflows/testserver.yml'
  pull_request:
    branches: [main, 4.x]
    paths:
      - 'testServer/**'
      - '.github/workflows/testserver.yml'
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_NAME: testserver

jobs:
  metadata:
    name: Generate Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      postfix: ${{ steps.semver.outputs.postfix }}
      tag: ${{ steps.semver.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate version
        id: semver
        uses: penguin-actions/semver@v1.0.1
        with:
          version-file: .version

  test:
    name: Test testServer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: testServer/go.sum

      - name: Run tests
        working-directory: testServer
        run: |
          go mod download
          go test -v ./...

      - name: Run go vet
        working-directory: testServer
        run: go vet ./...

      - name: Check formatting
        working-directory: testServer
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

  build:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: [metadata, test]
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKER }}/penguincloud/waddleperf-${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ needs.metadata.outputs.tag }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.metadata.outputs.postfix }},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./testServer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TARGETOS=linux

  pre-release:
    name: Create Pre-release
    runs-on: ubuntu-latest
    needs: [metadata, build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Create or update pre-release
        uses: penguin-actions/pre-release@v1.0.2
        with:
          version: ${{ needs.metadata.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, build, pre-release]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ needs.pre-release.result }}" != "success" ] && [ "${{ needs.pre-release.result }}" != "skipped" ]; then
            echo "❌ Pre-release failed"
            exit 1
          fi
          echo "✅ All checks passed"
