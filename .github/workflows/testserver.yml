name: Debug Build Simplified

on:
  push:
    branches: ["v4.1.x"]

jobs:
  metadata:
    name: Determine Build Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set variables
        id: vars
        run: |
          echo "tag=beta" >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - run: echo "Test"

  build:
    name: Build and push
    runs-on: ubuntu-latest
    needs: [metadata, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./testServer
          push: false
          tags: testserver:${{ needs.metadata.outputs.tag }}
      - run: echo "Build step"
