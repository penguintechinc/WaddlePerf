name: Build testServer

on:
  push:
    branches: [ main, 4.x, 'v*']
    paths:
      - 'testServer/**'
      - '.github/workflows/testserver.yml'
  pull_request:
    branches: [main, 4.x]
    paths:
      - 'testServer/**'
      - '.github/workflows/testserver.yml'
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_NAME: testserver
  ARTIFACT_NAME: testserver-build

jobs:
  test:
    name: Test testServer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: testServer/go.sum

      - name: Run tests
        working-directory: testServer
        run: |
          go mod download
          go test -v ./...

      - name: Run go vet
        working-directory: testServer
        run: go vet ./...

      - name: Check formatting
        working-directory: testServer
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

  metadata:
    name: Generate Metadata
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      version: ${{ steps.version.outputs.version }}
      postfix: ${{ steps.version.outputs.postfix }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version and tag
        id: version
        run: |
          VERSION=$(cat .version)
          POSTFIX="alpha"
          TAG="alpha"
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            POSTFIX="gamma"
            TAG="beta"
          elif [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            POSTFIX="beta"
            TAG="latest"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "postfix=${POSTFIX}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

  build:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: [test, metadata]
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./testServer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.version }}-${{ needs.metadata.outputs.postfix }}
            ${{ env.REGISTRY_GHCR }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.tag }}
            ${{ env.REGISTRY_DOCKER }}/penguincloud/waddleperf-${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.version }}-${{ needs.metadata.outputs.postfix }}
            ${{ env.REGISTRY_DOCKER }}/penguincloud/waddleperf-${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.tag }}
          labels: "org.opencontainers.image.version=${{ needs.metadata.outputs.version }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TARGETOS=linux
          outputs: type=local,dest=./build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./build/

  pre-release:
    name: Create Pre-release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == 'main'

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./release-artifacts

      - name: Create or update pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Development Build"
          body: "This is a pre-release development build from the main branch."
          prerelease: true
          files: ./release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, build, pre-release]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ needs.pre-release.result }}" != "success" ] && [ "${{ needs.pre-release.result }}" != "skipped" ]; then
            echo "❌ Pre-release failed"
            exit 1
          fi
          echo "✅ All checks passed"
