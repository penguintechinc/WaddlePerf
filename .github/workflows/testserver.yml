name: Testserver Build Up
on:
  push:
    branches:
      - "v4.1.x"
jobs:
  metadata:
    name: Determine Build Metadata
    runs-on: ubuntu-latest
    outputs:
      postfix: ${{ steps.vars.outputs.postfix }}
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - id: vars
        run: |
          echo "version=$(cat .version | cut -d. -f1-3)" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "postfix=-gamma" >> $GITHUB_OUTPUT
            echo "tag=gamma" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == v* || "${{ github.ref_name }}" == "4.x" ]]; then
            echo "postfix=-beta" >> $GITHUB_OUTPUT
            echo "tag=beta" >> $GITHUB_OUTPUT
          else
            echo "postfix=-alpha" >> $GITHUB_OUTPUT
            echo "tag=alpha" >> $GITHUB_OUTPUT
          fi
  test:
    name: Test Go Service
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: '1.25'
          cache-dependency-path: testServer/go.sum
      - run: go test -v ./...
        working-directory: ./testServer
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [metadata, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Set image tag
        id: tag
        run: echo "tag=beta-$(date +%s)" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        run: docker run --privileged --rm tonistiigi/binfmt --install all
      - name: Set up buildx
        run: docker buildx create --use --name builder
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and Push testserver
        run: |
          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/${{ github.repository }}/testserver:${{ steps.tag.outputs.tag }} \
            --tag ghcr.io/${{ github.repository }}/testserver:beta \
            --file ./testServer/Dockerfile \
            ./testServer
      - name: Build and Push unified-api
        run: |
          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/${{ github.repository }}/unified-api:${{ steps.tag.outputs.tag }} \
            --tag ghcr.io/${{ github.repository }}/unified-api:beta \
            --file ./services/unified-api/Dockerfile \
            ./services/unified-api
      - name: Build and Push webui
        run: |
          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            --secret id=npm_token,env=GITHUB_TOKEN \
            --tag ghcr.io/${{ github.repository }}/webui:${{ steps.tag.outputs.tag }} \
            --tag ghcr.io/${{ github.repository }}/webui:beta \
            --file ./webClient/Dockerfile \
            .
      - name: Output image tags
        run: echo "Built and pushed images with tag ${{ steps.tag.outputs.tag }}"
