name: Build testServer

on:
  push:
    branches: [main, 4.x, v4.1.x]
  pull_request:
    branches: [main, 4.x, v4.1.x]
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_NAME: testserver
  POSTFIX: -beta
  TAG: beta
  VERSION: v4.1.0

jobs:
  test:
    name: Test testServer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: testServer/go.sum
      - name: Run Go tests
        run: |
          cd testServer
          go mod download
          go test ./... -coverprofile=coverage.out
      - name: Upload Go coverage
        uses: codecov/codecov-action@v4
        with:
          file: testServer/coverage.out
          flags: testserver

  build:
    name: Build and push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=${{ env.VERSION }}${{ env.POSTFIX }}
            type=sha,prefix=${{ env.TAG }}-
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./testServer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build local binary for artifact
        run: |
          cd testServer
          CGO_ENABLED=0 go build -o ../testserver${{ env.POSTFIX }} ./cmd/testserver
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: testserver${{ env.POSTFIX }}
          path: testserver${{ env.POSTFIX }}
