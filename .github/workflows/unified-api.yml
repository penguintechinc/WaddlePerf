name: Build Unified API

on:
  push:
    branches: [main, 4.x, "v4.*"]
    tags: ['v*']
    paths:
      - 'services/unified-api/**'
      - 'services/unified-api/Dockerfile'
      - '.github/workflows/unified-api.yml'
  pull_request:
    branches: [main, 4.x, "v4.*"]
    paths:
      - 'services/unified-api/**'
      - 'services/unified-api/Dockerfile'
      - '.github/workflows/unified-api.yml'
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: unified-api

jobs:
  metadata:
    name: Determine Build Metadata
    runs-on: ubuntu-latest
    outputs:
      postfix: ${{ steps.vars.outputs.postfix }}
      tag: ${{ steps.vars.outputs.tag }}
      is_main: ${{ steps.vars.outputs.is_main }}
      is_release: ${{ steps.vars.outputs.is_release }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set variables
        id: vars
        run: |
          VERSION=$(cat .version | cut -d'.' -f1-3 | tr -d '[:space:]' || echo "0.0.0")
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "postfix=-gamma" >> $GITHUB_OUTPUT
            echo "tag=gamma" >> $GITHUB_OUTPUT
            echo "is_main=true" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/v* || "${{ github.ref }}" == refs/heads/4.x ]]; then
            echo "postfix=-beta" >> $GITHUB_OUTPUT
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "postfix=-alpha" >> $GITHUB_OUTPUT
            echo "tag=alpha" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  test:
    name: Test Unified API
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: services/unified-api/requirements.txt
      - name: Install dependencies
        working-directory: services/unified-api
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pytest pytest-cov pytest-asyncio aioresponses
      - name: Run unit tests
        run: |
          cd services/unified-api
          python3 -m pytest --cov=. --cov-report=xml -q
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: services/unified-api/coverage.xml
          flags: unified-api

  build:
    name: Build and push
    runs-on: ubuntu-latest
    needs: [metadata, test]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.tag }}
            type=raw,value=${{ needs.metadata.outputs.version }}${{ needs.metadata.outputs.postfix }}
            type=sha,prefix=${{ needs.metadata.outputs.tag }}-
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./services/unified-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export requirements for artifact
        run: |
          cp services/unified-api/requirements.txt unified-api-requirements${{ needs.metadata.outputs.postfix }}.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified-api-requirements${{ needs.metadata.outputs.postfix }}
          path: unified-api-requirements${{ needs.metadata.outputs.postfix }}.txt

  pre-release:
    name: Update Pre-Release
    runs-on: ubuntu-latest
    needs: [metadata, build]
    if: needs.metadata.outputs.is_main == 'true'
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: unified-api-requirements${{ needs.metadata.outputs.postfix }}
          path: .
      - name: Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          TAG="v$VERSION-gamma"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Pre-release $TAG" --prerelease --notes "Automated pre-release for main branch"
          fi
          gh release upload "$TAG" unified-api-requirements${{ needs.metadata.outputs.postfix }}.txt --clobber
