name: Build containerClient

on:
  push:
    branches: [main, 4.x, "v*"]
    tags: ['v*']
    paths:
      - 'containerClient/**'
      - '.github/workflows/containerclient.yml'
  pull_request:
    branches: [main, 4.x, "v*"]
    paths:
      - 'containerClient/**'
      - '.github/workflows/containerclient.yml'
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_NAME: containerclient

jobs:
  metadata:
    name: Determine Build Metadata
    runs-on: ubuntu-latest
    outputs:
      postfix: ${{ steps.vars.outputs.postfix }}
      tag: ${{ steps.vars.outputs.tag }}
      is_main: ${{ steps.vars.outputs.is_main }}
      is_release: ${{ steps.vars.outputs.is_release }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set variables
        id: vars
        run: |
          VERSION=$(cat .version | cut -d'.' -f1-3 | tr -d '[:space:]' || echo "0.0.0")
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "postfix=-gamma" >> $GITHUB_OUTPUT
            echo "tag=gamma" >> $GITHUB_OUTPUT
            echo "is_main=true" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/v* || "${{ github.ref }}" == refs/heads/4.x ]]; then
            echo "postfix=-beta" >> $GITHUB_OUTPUT
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "postfix=-alpha" >> $GITHUB_OUTPUT
            echo "tag=alpha" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  test:
    name: Test containerClient
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd containerClient
          pip3 install -r requirements.txt

      - name: Install test dependencies
        run: pip3 install pytest pytest-asyncio pytest-cov aioresponses

      - name: Run syntax check
        run: |
          cd containerClient
          python3 -m py_compile client.py
          python3 -m py_compile tests/*.py

      - name: Test import
        run: |
          cd containerClient
          python3 -c "from tests import HttpTest, TcpTest, UdpTest, IcmpTest; print('All imports successful')"

      - name: Run unit tests with coverage
        run: |
          cd containerClient
          python3 -m pytest --cov=client --cov-report=xml --cov-fail-under=90 -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: containerClient/coverage.xml
          flags: containerclient

  build:
    name: Build and push
    runs-on: ubuntu-latest
    needs: [metadata, test]
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKER }}/penguincloud/waddleperf-${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.tag }}
            type=raw,value=${{ needs.metadata.outputs.version }}${{ needs.metadata.outputs.postfix }}
            type=sha,prefix=${{ needs.metadata.outputs.tag }}-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./containerClient
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}

      - name: Export requirements for artifact
        run: |
          cp containerClient/requirements.txt containerclient-requirements${{ needs.metadata.outputs.postfix }}.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: containerclient-requirements${{ needs.metadata.outputs.postfix }}
          path: containerclient-requirements${{ needs.metadata.outputs.postfix }}.txt

  test-container:
    name: Test Docker container
    runs-on: ubuntu-latest
    needs: [metadata, build]

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and test container
        run: |
          IMAGE="${{ env.REGISTRY_GHCR }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.tag }}"
          echo "Testing image: $IMAGE"

          # Pull the image
          docker pull $IMAGE

          # Test help command
          docker run --rm $IMAGE --help

          # Test single HTTP test
          docker run --rm \
            -e AUTH_TYPE=none \
            -e HTTP_TARGETS=https://www.google.com \
            -e ENABLE_TCP_TEST=false \
            -e ENABLE_UDP_TEST=false \
            -e ENABLE_ICMP_TEST=false \
            $IMAGE --test-type http --http-target https://www.google.com

          echo "Container tests passed!"

  pre-release:
    name: Update Pre-Release
    runs-on: ubuntu-latest
    needs: [metadata, build]
    if: needs.metadata.outputs.is_main == 'true'
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: containerclient-requirements${{ needs.metadata.outputs.postfix }}
          path: .
      - name: Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          TAG="v$VERSION-gamma"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Pre-release $TAG" --prerelease --notes "Automated pre-release for main branch"
          fi
          gh release upload "$TAG" containerclient-requirements${{ needs.metadata.outputs.postfix }}.txt --clobber

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, build, test-container]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ needs.test-container.result }}" != "success" ]; then
            echo "❌ Container tests failed"
            exit 1
          fi
          echo "✅ All checks passed"
