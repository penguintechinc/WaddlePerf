name: Build containerClient

on:
  push:
    branches: [main, 4.x, v*]
    paths:
      - 'containerClient/**'
      - '.github/workflows/containerclient.yml'
  pull_request:
    branches: [main, 4.x]
    paths:
      - 'containerClient/**'
      - '.github/workflows/containerclient.yml'
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_NAME: containerclient

jobs:
  metadata:
    name: Generate Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      postfix: ${{ steps.semver.outputs.postfix }}
      tag: ${{ steps.semver.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate version
        id: semver
        uses: penguin-actions/semver@v1.0.1
        with:
          version-file: .version

  test:
    name: Test containerClient
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd containerClient
          pip install -r requirements.txt

      - name: Run syntax check
        run: |
          cd containerClient
          python -m py_compile client.py
          python -m py_compile tests/*.py

      - name: Test import
        run: |
          cd containerClient
          python -c "from tests import HttpTest, TcpTest, UdpTest, IcmpTest; print('All imports successful')"

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [metadata, test]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKER }}/penguincloud/waddleperf-${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ needs.metadata.outputs.tag }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.metadata.outputs.postfix }},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./containerClient
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}

  pre-release:
    name: Create Pre-release
    runs-on: ubuntu-latest
    needs: [metadata, build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Create or update pre-release
        uses: penguin-actions/pre-release@v1.0.2
        with:
          version: ${{ needs.metadata.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, build, pre-release]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ needs.pre-release.result }}" != "success" ] && [ "${{ needs.pre-release.result }}" != "skipped" ]; then
            echo "❌ Pre-release failed"
            exit 1
          fi
          echo "✅ All checks passed"
