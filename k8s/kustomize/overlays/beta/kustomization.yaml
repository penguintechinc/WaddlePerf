apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: waddleperf-beta
namePrefix: beta-
commonLabels:
  environment: beta
resources:
  - ../../base
replicas:
  - name: testserver
    count: 2
  - name: unified-api
    count: 2
  - name: webui
    count: 2
images:
  - name: registry-dal2.penguintech.io/waddleperf/testserver
    newTag: latest
  - name: registry-dal2.penguintech.io/waddleperf/unified-api
    newTag: latest
  - name: registry-dal2.penguintech.io/waddleperf/webui
    newTag: latest
configMapGenerator:
  - name: waddleperf-config
    behavior: merge
    literals:
      - LOG_LEVEL=INFO
      - RELEASE_MODE=false
