apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waddleperf
  namespace: waddleperf
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - "waddleperf.penguintech.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: unified-api
          port: 5000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: webui
          port: 3000
