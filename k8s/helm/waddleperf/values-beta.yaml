# Beta environment overrides (dal2 cluster)
namespace: waddleperf
replicaCount: 2
image:
  registry: ghcr.io/penguintechinc/waddleperf
  pullPolicy: Always
imagePullSecrets:
  - name: ghcr-pull-secret
env:
  LOG_LEVEL: INFO
  RELEASE_MODE: "false"
ingress:
  hosts:
    - host: waddleperf.penguintech.cloud
  tls:
    - secretName: penguintech-wildcard-tls
      hosts:
        - waddleperf.penguintech.cloud
